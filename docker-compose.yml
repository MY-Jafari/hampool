services:
  redis:
    image: redis:7-alpine
    container_name: hampool_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  django:
    build: .                            
    container_name: hampool_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                          
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: hampool_celery_worker
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: hampool_celery_beat
    command: celery -A core beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  static_volume:
  media_volume:
