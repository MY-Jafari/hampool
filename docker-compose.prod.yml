# ═══════════════════════════════════════════════════════════════
# HamPool – Docker Compose (Production)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences vs docker-compose.yml (dev):
#   • No source mounts — everything is baked into images
#   • Django runs under Gunicorn + Uvicorn workers (no --reload)
#   • Nginx builds the frontend (multi-stage) and serves the SPA
#   • db/redis ports are NOT exposed to the host (security)
#   • Flower is behind basic auth (FLOWER_USER / FLOWER_PASSWORD)
#   • Log rotation is enabled for all services
# ═══════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hampool_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hampool}
      POSTGRES_USER: ${POSTGRES_USER:-hampool_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hampool_user} -d ${POSTGRES_DB:-hampool}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ── Redis (cache + Celery broker) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hampool_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ── Django Backend (Gunicorn + Uvicorn) ───────────────────────
  django:
    build: .
    image: hampool-django:prod
    container_name: hampool_django
    command: >
      gunicorn core.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-4}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ── Celery Worker ─────────────────────────────────────────────
  celery_worker:
    build: .
    image: hampool-celery-worker:prod
    container_name: hampool_celery_worker
    command: celery -A core worker -l ${CELERY_LOG_LEVEL:-info} --concurrency=${CELERY_CONCURRENCY:-4}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ── Celery Beat (scheduler) ───────────────────────────────────
  celery_beat:
    build: .
    image: hampool-celery-beat:prod
    container_name: hampool_celery_beat
    command: celery -A core beat -l ${CELERY_LOG_LEVEL:-info}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ── Flower (Celery monitoring — basic-auth protected) ────────
  flower:
    build: .
    image: hampool-flower:prod
    container_name: hampool_flower
    command: celery -A core flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    logging: *default-logging

  # ── Nginx (builds frontend + serves SPA + reverse proxy) ─────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: hampool-nginx:prod
    container_name: hampool_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - django
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
