name: HamPool CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Run Backend Tests (Django + Celery + Channels)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            libcairo2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "DJANGO_SECRET_KEY=ci-test-secret" >> .env
          echo "DJANGO_DEBUG=True" >> .env
          echo "CELERY_TASK_ALWAYS_EAGER=True" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env
          echo "CELERY_BROKER_URL=redis://127.0.0.1:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/0" >> .env

      - name: Run tests
        run: |
          pytest apps/ -v --tb=short

  frontend-test:
    name: Run Frontend Checks (TypeScript + Lint + Tests + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest unit & MSW tests
        working-directory: frontend
        run: npm run test

      - name: Run Vite production build
        working-directory: frontend
        run: npm run build

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hampool:latest
